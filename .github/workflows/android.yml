name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

  
    - uses: actions/upload-artifact@v4
      with:
       name: app-debug
       path: '**/*.apk'
    
    - name: Build with Gradle
      run: cd app && chmod +x gradlew && ./gradlew assembleDebug
   



      




    
  


      






         



    
